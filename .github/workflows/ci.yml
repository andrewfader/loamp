name: LOAMP CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ['3.2', '3.3', '3.4', '4.0']
    env:
      GSK_RENDERER: cairo
      LIBGL_ALWAYS_SOFTWARE: '1'
      LOAMP_SCREENSHOT_DIR: tmp/e2e-screenshots
      TAGLIB_DIR: /usr/local
    steps:
      - uses: actions/checkout@v4

      # Native libraries must exist before setup-ruby installs the cached bundle.
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libadwaita-1-dev gir1.2-adw-1 libgirepository1.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-plugins-ugly gstreamer1.0-tools \
            build-essential pkg-config cmake libutfcpp-dev zlib1g-dev curl dbus xvfb

      # taglib-ruby 2.x needs TagLib >= 2.0.1; Ubuntu 24.04 ships TagLib 1.13.
      - name: Build TagLib 2.0.2
        working-directory: ${{ runner.temp }}
        run: |
          curl --fail --location --retry 3 \
            https://github.com/taglib/taglib/releases/download/v2.0.2/taglib-2.0.2.tar.gz \
            --output taglib-2.0.2.tar.gz
          tar -xzf taglib-2.0.2.tar.gz
          cmake -S taglib-2.0.2 -B taglib-build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$TAGLIB_DIR" \
            -DCMAKE_INSTALL_LIBDIR=lib -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF
          cmake --build taglib-build --parallel 2
          sudo cmake --install taglib-build
          sudo ldconfig
          pkg-config --atleast-version=2.0.1 taglib
          pkg-config --modversion taglib gobject-introspection-1.0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
          cache-version: taglib-2.0.2

      - name: RuboCop
        run: bundle exec rubocop

      - name: Tests and coverage
        run: xvfb-run -a dbus-run-session -- bundle exec rspec
        env:
          COVERAGE: ${{ matrix.ruby-version == '4.0' && 'true' || '' }}

      - name: Integration tests
        run: xvfb-run -a dbus-run-session -- bundle exec ruby spec/integration_test.rb

      - name: Build archive
        run: bundle exec rake build

      - name: Upload build
        if: matrix.ruby-version == '4.0'
        uses: actions/upload-artifact@v4
        with:
          name: loamp-source
          path: pkg/*.tar.gz
          if-no-files-found: error

      - name: Upload test reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-ruby-${{ matrix.ruby-version }}
          path: |
            coverage/
            tmp/e2e-screenshots/
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: matrix.ruby-version == '4.0'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/coverage.json
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unittests
